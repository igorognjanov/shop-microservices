spring:
  application:
    name:
      order-service
  datasource:
    url: "jdbc:postgresql://127.0.0.1:5434/order_service"
    username: igor
    password: secret

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect:
          org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  error:
    include-message: always

inventory:
  url: "http://localhost:8082"